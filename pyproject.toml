[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "pitch-garden"
authors = [{ name = "Takenori Yoshimura" }]
maintainers = [
  { name = "Takenori Yoshimura", email = "takenori@sp.nitech.ac.jp" },
]
description = "A unified interface to various pitch trackers with ensemble voting"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pitch", "f0", "speech-processing", "singing-voice"]
# The ported code keeps its own license, e.g., MIT of torchcrepe and ISC of librosa.
license = "Apache-2.0 AND MIT AND ISC"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy >= 1.26.0",
  "pyyaml >= 6.0",
  "soundfile >= 0.10.2",
  "soxr >= 0.4.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# The trackers not requiring PyTorch.
lite = [
  "amfm-decompy >= 1.0.12.2",
  "pitch-garden-sptk >= 0.1.0",
  "pylstraight >= 0.1.3",
  "swift-f0[audio] >= 0.3.0",
]
# The trackers requiring PyTorch, where pesto-pitch is excluded on Python 3.15 or
# later because it requires torchaudio, which does not support the versions.
torch = [
  "h5py >= 3.10.0",
  "pesto-pitch >= 2.0.1; python_version < '3.15'",
  "torch >= 2.2.0",
]
all = ["pitch-garden[lite,torch]"]

[dependency-groups]
dev = [
  "cmake-format",
  "mdformat",
  "numpydoc",
  "pydata-sphinx-theme",
  "pyright[nodejs]",
  "pytest",
  "ruff",
  "sphinx",
  "twine",
]

# The build of PyTorch for development, which is chosen by `make setup TORCH=...`.
cpu = ["torch", "torchaudio; python_version < '3.15'"]
gpu = ["torch", "torchaudio; python_version < '3.15'"]

[project.urls]
Source = "https://github.com/sp-nitech/pitch-garden"

[project.scripts]
pitch-garden = "pitch_garden.cli:main"

[tool.uv]
# The CPU and GPU builds of PyTorch cannot be installed together.
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]
# Ignore the packages uploaded recently to mitigate supply chain attacks.
exclude-newer = "14 days"

[tool.uv.workspace]
members = ["bindings/sptk"]

# The CPU build of PyTorch avoids the large CUDA libraries, e.g., in CI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The CUDA 12.X build of PyTorch runs with the older drivers of the GPU servers.
[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
pitch-garden-sptk = { workspace = true }
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-gpu", group = "gpu" },
]
torchaudio = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-gpu", group = "gpu" },
]

[tool.hatch.build.targets.sdist]
only-include = ["pitch_garden"]

[tool.hatch.version]
path = "pitch_garden/version.py"

[tool.ruff]
exclude = ["third_party"]
target-version = "py312"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]
ignore = [
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.isort]
# The utilities shared by the recipes, which are linked from 'local/utils'.
known-local-folder = ["utils"]

[tool.pyright]
exclude = [".venv", "examples/*/exp"]

[tool.pytest.ini_options]
addopts = "-s -x --doctest-modules"
