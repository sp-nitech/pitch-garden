[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitch-garden"
authors = [{ name = "Takenori Yoshimura" }]
maintainers = [
  { name = "Takenori Yoshimura", email = "takenori@sp.nitech.ac.jp" },
]
description = "A unified interface to various pitch trackers with ensemble voting"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pitch", "f0", "speech-processing", "singing-voice"]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy >= 1.26.0",
  "pyyaml >= 6.0",
  "soundfile >= 0.10.2",
  "soxr >= 0.4.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# The trackers not requiring PyTorch.
lite = [
  "pitch-garden-sptk >= 0.1.0",
  "pylstraight >= 0.1.3",
  "swift-f0[audio] >= 0.3.0",
]
# The trackers requiring PyTorch.
torch = ["pesto-pitch >= 2.0.1", "torch >= 2.2.0"]
all = ["pitch-garden[lite,torch]"]

[dependency-groups]
dev = [
  "cmake-format",
  "mdformat",
  "numpydoc",
  "pyright[nodejs]",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine",
]

# The build of PyTorch for development, which is chosen by `make setup TORCH=...`.
cpu = ["torch", "torchaudio"]
gpu = ["torch", "torchaudio"]

[project.urls]
Source = "https://github.com/takenori-y/pitch-garden"

[project.scripts]
pitch-garden = "pitch_garden.cli:main"

[tool.uv]
# Ignore the packages uploaded recently to mitigate supply chain attacks.
exclude-newer = "14 days"
# The CPU and GPU builds of PyTorch cannot be installed together.
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]
# swift-f0 0.3.0 and pylstraight 0.1.3 are allowed as exceptions, while their newer
# versions are not.
exclude-newer-package = { swift-f0 = "2026-09-26T00:00:00Z", pylstraight = "2026-10-07T00:00:00Z" }

[tool.uv.workspace]
members = ["bindings/sptk"]

# The CPU build of PyTorch avoids the large CUDA libraries, e.g., in CI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
pitch-garden-sptk = { workspace = true }
torch = [{ index = "pytorch-cpu", group = "cpu" }]
torchaudio = [{ index = "pytorch-cpu", group = "cpu" }]

[tool.hatch.build.targets.sdist]
only-include = ["pitch_garden"]

[tool.hatch.version]
path = "pitch_garden/version.py"

[tool.ruff]
exclude = ["third_party"]
target-version = "py312"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]
ignore = [
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.isort]
# The utilities shared by the recipes, which are linked from 'local/utils'.
known-local-folder = ["utils"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "except", "raise"]

[tool.pyright]
exclude = ["**/third_party", ".venv", "examples/*/exp"]

[tool.pytest.ini_options]
addopts = "-s -x --doctest-modules"
