[build-system]
requires = ["scikit-build-core >= 0.10", "nanobind >= 2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pitch-garden-sptk"
version = "0.1.0"
authors = [{ name = "Takenori Yoshimura" }]
maintainers = [
  { name = "Takenori Yoshimura", email = "takenori@sp.nitech.ac.jp" },
]
description = "A Python binding of the pitch extraction of SPTK for pitch-garden"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT; the bundled SPTK and its third-party libraries are under their own licenses" }
dependencies = ["numpy >= 1.26.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/pitch_garden_sptk"]
# Build a wheel of the stable ABI, which works with Python 3.12 and later.
wheel.py-api = "cp312"
wheel.license-files = [
  "LICENSE",
  "third_party/SPTK/LICENSE",
  "third_party/SPTK/third_party/*/LICENSE*",
]
sdist.include = ["third_party/SPTK"]

[tool.cibuildwheel]
build = ["cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
# Keep the cooldown of the uploaded packages in the build containers.
environment-pass = ["PIP_UPLOADED_PRIOR_TO"]
test-requires = ["pytest"]
# The test sources are relative to the directory where cibuildwheel is run, i.e.,
# the root of the repository in CI.
test-sources = ["bindings/sptk/tests"]
test-command = "pytest bindings/sptk/tests"
