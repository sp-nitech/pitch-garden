name: release

# Run manually from the Actions tab after choosing the packages to publish. The
# packages are published only if all the jobs of the CI pass.
on:
  workflow_dispatch:
    inputs:
      pitch-garden-sptk:
        description: Publish pitch-garden-sptk
        type: boolean
        default: false

      pitch-garden:
        description: Publish pitch-garden
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish-sptk:
    if: inputs.pitch-garden-sptk && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pitch-garden-sptk
    permissions:
      id-token: write

    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sptk-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # pitch-garden is published after pitch-garden-sptk if both are chosen, so that
  # its dependency is available.
  publish-garden:
    if: >-
      !cancelled() && inputs.pitch-garden && github.ref == 'refs/heads/master' && needs.ci.result == 'success' && needs.publish-sptk.result != 'failure'
    needs:
      - ci
      - publish-sptk
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pitch-garden
    permissions:
      id-token: write

    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: garden-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
